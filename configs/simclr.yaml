# SimCLR ("SimCLR-new"): NT-Xent contrastive learning between two random resized crops of
# the same volume; all crops of other volumes in the global batch are negatives.
# This template holds the ViT-Base values.  launch.py sets arch, qk_norm, base_lr,
# index_json, total_steps and run_dir; train.py reads only the resolved file.

method: simclr

# ── encoder ──
arch: base                     # tiny | base | huge (set by launch.py)
in_chans: 1                    # input channels (one MRI contrast)
patch_size: 16                 # cubic patch edge; a 96^3 crop gives 6^3 = 216 tokens
valid_token_threshold: 0.1     # a token is brain-valid when >= 10% of its voxels are brain
qk_norm: true                  # per-head LayerNorm on q and k (on for every SimCLR run)
qk_norm_eps: 1.0e-2            # LayerNorm eps of the q/k normalisation
grad_checkpointing: false      # recompute block activations in backward (memory only)

# ── views (random resized crops centred on brain voxels, each augmented once) ──
crop_size: 96                  # crop edge after resize
n_views: 2                     # crops per volume; the other crop of the same volume is the positive
scale_range: [0.5, 1.0]        # window edge = scale * longest volume axis

# ── projection head and loss ──
proj_hidden: 2048              # Linear(D, proj_hidden) -> BatchNorm -> ReLU -> Linear(proj_hidden, proj_dim)
proj_dim: 128                  # embedding dimension of the contrastive loss
temperature: 0.1               # NT-Xent temperature

# ── augmentation (GPU, per crop; probabilities are per sample) ──
aug:
  flip_p: 0.5                  # flip probability per spatial axis
  rotate_p: 0.5                # 90-degree rotation probability per axis pair
  noise_p: 0.5                 # additive Gaussian noise, std ~ U[0, noise_std]
  noise_std: 0.05
  blur_p: 0.5                  # Gaussian blur, sigma ~ U[blur_sigma] voxels
  blur_sigma: [0.25, 1.0]
  gamma_p: 0.5                 # gamma contrast, exponent ~ U[gamma]
  gamma: [0.5, 2.0]
  hist_shift_p: 0.5            # monotone piecewise-linear intensity remap (10 control points, +-30%)

# ── data ──
index_json: null               # JSON list of .b2nd volume paths (set by launch.py)
batch_size_per_gpu: 64         # volumes per GPU per micro-batch (x n_views crops)
grad_accum: 1                  # micro-batches per optimizer step
num_workers: 4                 # DataLoader workers per rank

# ── optimizer (AdamW, eps 1e-8; backbone + projection head) ──
base_lr: 1.0e-4                # peak_lr = base_lr * volumes_per_step / 256 (crops do not enter)
weight_decay: 0.1              # constant; applied to tensors with ndim >= 2 only
adamw_beta1: 0.9
adamw_beta2: 0.999
patch_embed_lr_mult: 0.2       # learning-rate multiplier of the patch embedding
clip_grad: 3.0                 # global gradient-norm clip, every step

# ── schedule ──
warmup_frac: 0.1               # linear warm-up over this fraction of total_steps
min_lr: 1.0e-6                 # absolute floor of the cosine decay
total_steps: null              # optimizer steps (set by launch.py from --epochs)

# ── run ──
run_dir: null                  # output directory (set by launch.py)
seed: 42                       # base seed; per-rank generators derive from it: seed + rank (torch / NumPy / Python / augmentation), seed * 1000 + rank (crop sampling)
log_every: 20                  # steps between log lines
feat_every: 200                # steps between feature-rank / attention diagnostics
ckpt_every_steps: 5000         # steps between rolling resume checkpoints
